  <script>
    //const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isAndroid = /Android/.test(navigator.userAgent);
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

    console.log('📱 Device Detection:', {
        isIOS: isIOS,
        isSafari: isSafari, 
        isAndroid: isAndroid,
        userAgent: navigator.userAgent
    });

    // ✅ Register service worker (path relative to <base>)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./serviceWorker.js', { scope: './' })
            .then((reg) => {
                console.log('✅ SW registered:', reg.scope);
            })
            .catch((err) => console.error('❌ SW registration failed:', err));
    }

    // Universal PWA install handler
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
        console.log('📱 PWA install available');
        e.preventDefault();
        deferredPrompt = e;
        
        // Show install banner after 3 seconds
        setTimeout(() => {
            showInstallBanner();
        }, 3000);
    });

    function showInstallBanner() {
        const banner = document.getElementById('installBanner');
        if (banner && deferredPrompt) {
            banner.style.display = 'block';
            // Small delay for animation
            setTimeout(() => {
                banner.classList.add('show');
            }, 10);
            console.log('📱 Showing install banner');
        }
    }

    function hideInstallBanner() {
        const banner = document.getElementById('installBanner');
        if (banner) {
            banner.classList.remove('show');
            setTimeout(() => {
                banner.style.display = 'none';
            }, 400); // Match CSS transition duration
        }
    }
    document.addEventListener('DOMContentLoaded', function() {
        // Install button handler
        const installBtn = document.getElementById('installBtn');
        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                if (!deferredPrompt) {
                    console.warn('⚠️ No install prompt available');
                    hideInstallBanner();
                    return;
                }
                
                deferredPrompt.prompt();
                const choice = await deferredPrompt.userChoice;
                console.log('👍 User choice:', choice.outcome);
                
                deferredPrompt = null;
                hideInstallBanner();
            });
        }

        // Dismiss button handler
        const installDismiss = document.getElementById('installDismiss');
        if (installDismiss) {
            installDismiss.addEventListener('click', () => {
                console.log('🚫 User dismissed install banner');
                hideInstallBanner();
                // Don't show again for 7 days
                localStorage.setItem('installBannerDismissed', Date.now());
            });
        }

        // iOS-specific: Show install guide
        if (isIOS) {
            setTimeout(() => {
                const guideDismissed = localStorage.getItem('iosGuideDismissed');
                if (!guideDismissed) {
                    showIOSInstallGuide();
                }
            }, 5000);
        }
    });

    // iOS install guide functions
    function showIOSInstallGuide() {
        const guide = document.getElementById('iosInstallGuide');
        if (guide) {
            guide.classList.add('show');
        }
    }

    function hideIOSInstallGuide() {
        const guide = document.getElementById('iosInstallGuide');
        if (guide) {
            guide.classList.remove('show');
            localStorage.setItem('iosGuideDismissed', 'true');
        }
    }

    // Close button for iOS guide
    const closeBtn = document.getElementById('closeIosGuide');
    if (closeBtn) {
        closeBtn.addEventListener('click', hideIOSInstallGuide);
    }
</script>

<script>
// Add this to test CSS interference
document.addEventListener('DOMContentLoaded', function() {
    console.log('🔍 Checking for CSS issues...');
    
    // Test 1: Check if form elements are visible and clickable
    const loginButton = document.getElementById('loginButton');
    if (loginButton) {
        const styles = window.getComputedStyle(loginButton);
        console.log('Login button CSS:', {
            display: styles.display,
            visibility: styles.visibility,
            opacity: styles.opacity,
            pointerEvents: styles.pointerEvents,
            cursor: styles.cursor,
            zIndex: styles.zIndex
        });
        
        if (styles.pointerEvents === 'none') {
            console.error('❌ Button has pointer-events: none !');
            loginButton.style.pointerEvents = 'auto';
        }
    }
    
    // Test 2: Check for overlay elements blocking clicks
    const loginScreen = document.getElementById('loginScreen');
    if (loginScreen) {
        // Look for any ::before or ::after that might be blocking
        const pseudoStyles = window.getComputedStyle(loginScreen, '::before');
        if (pseudoStyles.content !== 'none') {
            console.warn('⚠️ loginScreen has ::before pseudo-element');
        }
    }
    
    // Test 3: Manually test click without CSS interference
    const form = document.getElementById('loginForm');
    if (form) {
        const originalSubmit = form.onsubmit;
        form.onsubmit = function(e) {
            console.log('🎯 Form submit triggered (direct, not via event listener)');
            e.preventDefault();
            
            // Test credentials directly
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            console.log('Testing:', {email, password});
            
            // Simulate login
            if (email && password) {
                localStorage.setItem('loggedIn', 'true');
                localStorage.setItem('userEmail', email);
                console.log('✅ Manual login successful');
                document.getElementById('loginScreen').style.display = 'none';
            }
            
            return false;
        };
    }
});
</script>
