<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Budget Tracker">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashers Finance Manager</title>
  <base href="/dashers-finance-manager/">
  
  <!-- CSS for splash and login only -->
  <style>
    /* RESET & BASE */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, sans-serif; overflow-x: hidden; }
    
    /* BACKGROUND GRADIENT */
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    
    /* SPLASH SCREEN */
    #splashScreen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      color: white;
      text-align: center;
      transition: opacity 0.5s ease;
    }
    
    .splash-inner img {
      width: 96px;
      height: 96px;
      margin-bottom: 20px;
      border-radius: 20px;
    }
    
    .splash-inner h1 {
      font-size: 2.5rem;
      margin-bottom: 30px;
      color: white;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin: 0 auto;
    }
    
    /* LOGIN SCREEN */
    #loginScreen {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    
    .login-container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .login-logo img {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
    
    .login-title {
      font-size: 2rem;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }
    
    .login-subtitle {
      color: #6b7280;
      margin-bottom: 10px;
    }
    
    .version-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: white;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    
    /* FORM STYLES */
    .form-group {
      margin-bottom: 20px;
    }
    
    .form-label {
      display: block;
      margin-bottom: 8px;
      color: #1f2937;
      font-weight: 500;
    }
    
    .form-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    
    .form-input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    
    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #6b7280;
    }
    
    .checkbox-custom {
      width: 18px;
      height: 18px;
      border: 2px solid #d1d5db;
      border-radius: 4px;
      display: inline-block;
      position: relative;
    }
    
    .checkbox-label input:checked + .checkbox-custom {
      background: #6366f1;
      border-color: #6366f1;
    }
    
    .checkbox-label input:checked + .checkbox-custom::after {
      content: '✓';
      position: absolute;
      color: white;
      font-size: 12px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
    
    .forgot-password {
      color: #6366f1;
      font-size: 0.875rem;
      text-decoration: underline;
    }
    
    .btn-login {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }
    
    .login-note {
      text-align: center;
      margin-top: 20px;
      color: #6b7280;
    }
    
    .security-notice {
      text-align: center;
      margin-top: 20px;
      color: #6b7280;
      font-size: 0.875rem;
    }
    
    /* ANIMATIONS */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* HIDDEN CLASS */
    .hidden {
      display: none !important;
    }
    
    /* DEVELOPMENT BANNER */
    .dev-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: #f39c12;
      color: white;
      text-align: center;
      padding: 10px;
      font-weight: bold;
      z-index: 1001;
    }
  </style>
  
  <!-- Icons -->
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="manifest" href="./manifest.json">
</head>
<body>
  <!-- Development Banner -->
  <div id="branchIndicator" class="dev-banner">
    ⚠️ DEVELOPMENT VERSION - Data resets may occur ⚠️
  </div>

  <!-- Splash Screen -->
  <div id="splashScreen">
    <div class="splash-inner">
      <img src="assets/icons/icon-192.png" alt="Budget Tracker Logo">
      <h1>Dashers Finance Manager</h1>
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Login Screen -->
  <div id="loginScreen">
    <div class="login-container">
      <div class="login-header">
        <div class="login-logo">
          <img src="assets/icons/icon-192.png" alt="Budget Tracker">
        </div>
        <h1 class="login-title">Dashers Finance</h1>
        <p class="login-subtitle">Secure Financial Management</p>
        <div class="version-badge">Development Version</div>
      </div>

      <div id="loginError" class="hidden" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none;">
        Invalid email or password
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="admin@budgettracker.com" value="admin@budgettracker.com" required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" value="admin123" required>
        </div>

        <div class="login-options">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" checked>
            <span class="checkbox-custom"></span>
            <span class="checkbox-text">Remember me</span>
          </label>
          <a href="#" class="forgot-password" id="forgotPassword">Forgot password?</a>
        </div>

        <button type="submit" class="btn-login" id="loginButton">
          Sign In
        </button>
      </form>

      <p class="login-note">
        Don't have an account? 
        <a href="#" class="link" id="registerLink" style="color: #6366f1;">Create account</a>
      </p>

      <div class="security-notice">
        <span style="margin-right: 5px;">🔒</span>
        <small>Your data is encrypted and stored locally</small>
      </div>
    </div>
  </div>

  <!-- Main App Container (navigation.js will populate this) -->
  <div id="appContainer" style="display: none;"></div>

  <!-- JavaScript that integrates with your modules -->
  <script>
    // Minimal initialization that works with your modules
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM Content Loaded - Initializing...');
      
      const splashScreen = document.getElementById('splashScreen');
      const loginScreen = document.getElementById('loginScreen');
      const appContainer = document.getElementById('appContainer');
      const loginForm = document.getElementById('loginForm');
      const loginError = document.getElementById('loginError');
      
      // Force clear login state for testing
      localStorage.removeItem('loggedIn');
      localStorage.removeItem('userEmail');
      
      // Show splash immediately
      splashScreen.style.display = 'flex';
      
      // Hide splash after 1.5 seconds and check auth
      setTimeout(() => {
        splashScreen.style.opacity = '0';
        
        setTimeout(() => {
          splashScreen.style.display = 'none';
          
          // Check if user is already logged in
          const isLoggedIn = localStorage.getItem('loggedIn') === 'true';
          
          if (isLoggedIn) {
            console.log('User is already logged in, showing app');
            showApp();
          } else {
            console.log('User not logged in, showing login screen');
            loginScreen.style.display = 'flex';
          }
        }, 500);
      }, 1500);
      
      // Handle login form submission
      if (loginForm) {
        loginForm.addEventListener('submit', function(e) {
          e.preventDefault();
          
          const email = document.getElementById('email').value;
          const password = document.getElementById('password').value;
          
          // Simple validation - accept any non-empty credentials
          if (email && password) {
            console.log('Login successful with:', email);
            
            // Hide login error if shown
            if (loginError) {
              loginError.style.display = 'none';
            }
            
            // Save login state
            localStorage.setItem('loggedIn', 'true');
            localStorage.setItem('userEmail', email);
            
            // Hide login screen
            loginScreen.style.display = 'none';
            
            // Show app
            showApp();
          } else {
            // Show error
            if (loginError) {
              loginError.style.display = 'block';
              loginError.textContent = 'Please enter both email and password';
            }
          }
        });
      }
      
      // Function to show the app
      function showApp() {
        console.log('Showing app container');
        appContainer.style.display = 'block';
        
        // Let your modules know they can initialize now
        window.dispatchEvent(new CustomEvent('appReady'));
        
        // Initialize navigation if the function exists
        if (typeof initNavigation === 'function') {
          console.log('Calling initNavigation');
          initNavigation();
        } else {
          console.warn('initNavigation function not found');
        }
      }
      
      // Define checkAuthState for your UI module
      window.checkAuthState = function() {
        return localStorage.getItem('loggedIn') === 'true';
      };
      
      // Forgot password link
      const forgotPassword = document.getElementById('forgotPassword');
      if (forgotPassword) {
        forgotPassword.addEventListener('click', function(e) {
          e.preventDefault();
          alert('Password reset: Use admin@budgettracker.com / admin123');
        });
      }
      
      // Register link
      const registerLink = document.getElementById('registerLink');
      if (registerLink) {
        registerLink.addEventListener('click', function(e) {
          e.preventDefault();
          alert('Register: Coming soon! Use admin@budgettracker.com / admin123 for now');
        });
      }
    });
    
    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./serviceWorker.js')
          .then(reg => console.log('Service Worker registered'))
          .catch(err => console.log('Service Worker failed:', err));
      });
    }
  </script>
  
  <!-- Load your modules AFTER the DOM is ready -->
  <script src="js/vendor/dexie.min.js"></script>
  <script type="module" src="./js/app.js"></script>
    <script type="module" src="./js/chart.js"></script>
  <script type="module" src="./js/ui.js"></script>
  <script type="module" src="./js/navigation.js"></script>
</body>
</html>
